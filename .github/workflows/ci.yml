name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build

  e2e:
    name: Obsidian E2E (${{ matrix.obsidian }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        obsidian: ["1.6.7", latest]
    env:
      OBSIDIAN_VERSION: ${{ matrix.obsidian }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Obsidian and WebDriver downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .obsidian-cache/obsidian-app
            .obsidian-cache/obsidian-installer
            .obsidian-cache/electron-chromedriver
          key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ hashFiles('package-lock.json', 'manifest.json') }}

      - name: Set up virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb openbox xauth libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64

      - name: Test in Obsidian
        run: |
          if [[ "$OBSIDIAN_VERSION" == latest ]]; then
            export OBSIDIAN_INSTALLER_VERSION=latest
          fi
          npm run test:e2e

      - name: Upload E2E logs and failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.obsidian }}
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 7
